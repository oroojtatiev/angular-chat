<div class="container">
  <div>
    <div class="login">
      <a [routerLink]="['../register']" mat-raised-button>Go to register page</a>
    </div>

    <div>
      <mat-card>
        <mat-card-content>
          <mat-card-title>Login</mat-card-title>

          <form [formGroup]="form" (ngSubmit)="login()">
            <mat-form-field>
              <mat-label>Email</mat-label>
              <input type="email" matInput placeholder="Email" formControlName="email" autocomplete="email"/>
              <mat-error *ngIf="email.touched && email.hasError('required')">Email is required</mat-error>
              <mat-error *ngIf="email.touched && email.hasError('email')">Email must be valid</mat-error>
            </mat-form-field>

            <mat-form-field>
              <mat-label>Password</mat-label>
              <input type="password" matInput placeholder="Password" formControlName="password"/>
              <mat-error *ngIf="password.touched && password.hasError('required')">Password is required</mat-error>
            </mat-form-field>

            <mat-card-actions>
              <button type="submit" [disabled]="!form.valid" mat-raised-button color="primary">Login</button>
            </mat-card-actions>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
